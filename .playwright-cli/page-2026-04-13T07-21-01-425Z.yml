      - article "CH001 餐巾纸上的名字" [ref=e24]:
        - generic "文章简介" [ref=e25]:
          - paragraph [ref=e26]: 小说 · 《看见缝隙的人》 · 第1章
          - heading "CH001 餐巾纸上的名字" [level=1] [ref=e27]
          - paragraph [ref=e28]: 从罗萨里奥街头和纽维尔少年队的日子，到生长激素缺乏带来的治疗压力，再到2000年9月巴塞罗那试训和12月14日的餐巾纸承诺，梅西第一次被巴塞罗那真正写到纸上。
        - generic [ref=e29]:
          - heading "CH001 餐巾纸上的名字" [level=1] [ref=e30]
          - heading "土场、病单和不肯停球" [level=2] [ref=e31]
          - paragraph [ref=e32]: 球刚滚进土坑里，几个比他高一头的孩子就一起扑了过去。只有梅西没乱。他先用左脚把球轻轻一粘，再从两条腿之间往前一拨，人也跟着钻了过去。有人在场边喊：“把球传出来！”他没抬头，肩一缩，又带着球往前跑。父亲豪尔赫下班赶到场边时，先看见的总是这一幕：那个小小的身影埋着头，带球从一群大孩子腿边往前挤。罗萨里奥很多球场都不像正经球场，更像一块被孩子们踩熟了的空地。草长得不齐，边上有土，球一滚过去就会带起一层灰。梅西小时候就是在这种地方追球的。
          - paragraph [ref=e33]: 他在纽维尔老男孩少年队越踢越顺，麻烦却不是从球场上来的。先是长得慢，后来几乎不怎么长了。医院里的灯很白，医生把结果说得很平：生长激素缺乏，要治疗，要打针，也要花很多钱。那天晚上，家里的饭桌安静得厉害。母亲把账单折了一下，又展开；豪尔赫把那张纸接过去，用指节压住边角，一行一行往下看，像是想先把数字看熟，再决定拿什么去扛。梅西坐在旁边，手压着膝盖，一声不吭。过了很久，豪尔赫才说：“球先别停。”他不太会说安慰人的话，能先给出来的，通常只有这句。梅西抬起头，看了父亲一眼，点了点头。
          - paragraph [ref=e34]: 第二天他还是照常去训练。个子不够，反而让他更容易从人缝里钻过去。别人一旦被围住，就会喊他名字，把球塞给他。梅西接球，转身，再往前。看起来最容易被撞开的那个孩子，偏偏总能把球带出来。问题是，光会踢球不够。药要打，钱要算，日子也要往下过。豪尔赫四处去问，俱乐部也不是没动过念头，可事情绕来绕去，还是落回同一堵墙上。留在罗萨里奥，路只会越来越窄。
          - heading "去巴塞罗那试试看" [level=2] [ref=e35]
          - paragraph [ref=e36]: 去巴塞罗那的主意，就是在这种时候慢慢成形的。先是有人提议，去欧洲试试看；后来，这个主意真的变成了一张机票、一只箱子和一次出发。2000年9月，梅西跟着豪尔赫到了巴塞罗那。陌生的城市铺在眼前，街道更宽，楼更高，空气里带着海边的潮气。豪尔赫提着箱子，走几步就回头看一眼，像怕这孩子真被这座城一下吞进去。到了训练场外，他没再多铺垫，只把箱子往地上一放，说：“先踢给他们看。”梅西把背包往上提了提，只回了一句：“好。”
          - paragraph [ref=e37]: 试训在庞培亚那边开始。训练场很平，草很整齐，场边站着的人也比罗萨里奥多得多。刚分组时，没谁真把这个阿根廷来的小个子放在眼里。球衣挂在身上显得大，腿细，肩也窄，看着不像能在这种地方站稳的人。有人随口问他：“你踢哪边？”梅西把球停到脚下：“都行。”
          - paragraph [ref=e38]: 哨声一响，事情就变了。第一次带球，他直接沿边线往里切；第二次变向，跟上来的人脚下一乱，重心先丢了；第三次，他从两三条腿之间把球带出来，顺势把人甩在身后。场边原本站得散的人，一点点往前挪。训练还没结束，就已经有人在问：“这孩子是谁？”梅西没看场边，只顾着继续踢。大人们还在为合同、治疗和住处反复商量，梅西先用试训把自己留在了场上。
          - heading "漫长等待最后落到餐巾纸上" [level=2] [ref=e39]
          - paragraph [ref=e40]: 两周试训结束后，训练场给的答案已经够清楚，真正的答复却一直没落下来。9月过去了，10月过去了，11月也过去了。白天去训练，晚上回去等消息，电话打来打去，总像差最后那一页纸。豪尔赫白天去问，晚上回来时外套里总带着一股烟味和潮气，进门先把钥匙放下，再说一句“再等等”。有一次他刚放下电话，梅西就从门边抬起头问：“他们到底要不要我？”豪尔赫没立刻接话，只把烟盒在掌心里攥了攥，才说：“再等等。”他不肯乱给准话，可也不肯先把路收回去。这个“再等等”拖了一周，又一周。一个十三岁的孩子，还没等来一句准话，就先学会了怎么在巴塞罗那等消息。
          - paragraph [ref=e41]: 到了12月14日，雷克萨奇先不想再等了。那天下午，在庞培亚网球俱乐部的吧台边，正式文件没有带来，推来推去的话倒是已经听够了。桌上有杯子，有碟子，还有一张被水汽打湿的餐巾纸。桌边还有人想继续解释流程、继续往后推，雷克萨奇却先把手抬起来压了一下，意思很清楚：别再绕了。他本来就不是喜欢把判断拖成会议的人。那张纸被他拽过来，用手掌压平，低头就写。笔尖划过去的时候，桌边几个人都没说话，只听见纸被压住时发出一点轻微的皱响。
          - paragraph [ref=e42]: 那不是正式合同，也没有马上把所有麻烦都解决。注册手续、治疗费用、住处安排，样样都还在后面。可从这一天起，梅西的名字第一次被巴塞罗那认真写到了纸上。到这一步，他不再只是训练场边被人议论的阿根廷小孩，巴塞罗那也不再只是口头上说愿意看看他。
          - paragraph [ref=e43]: 名字先被留下来了。
          - paragraph [ref=e44]: 可真正难熬的，还在后面。人住不住得进来，比赛踢不踢得上，都还没有答案。
          - paragraph [ref=e45]: "-------"
