<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="pipelineBg" x1="180" y1="60" x2="1410" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#121B2D"/>
      <stop offset="1" stop-color="#1B2234"/>
    </linearGradient>
    <linearGradient id="pipelineAccent" x1="240" y1="220" x2="1350" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6DB8FF"/>
      <stop offset="1" stop-color="#8FE0D1"/>
    </linearGradient>
    <filter id="pipelineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02060D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#pipelineBg)"/>
  <text x="120" y="118" fill="#F4F7FB" font-size="52" font-family="Arial, sans-serif" font-weight="700">Agentic Quality Pipeline</text>
  <text x="120" y="164" fill="#9EB8D8" font-size="24" font-family="Arial, sans-serif">How skill-based automation turns work into an enforceable engineering loop</text>

  <g filter="url(#pipelineShadow)">
    <rect x="110" y="260" width="180" height="120" rx="28" fill="#0F1A2B" stroke="#314860" stroke-width="2"/>
    <text x="160" y="320" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">Issue</text>
    <text x="152" y="350" fill="#95AFCF" font-size="18" font-family="Arial, sans-serif">entry point</text>

    <rect x="360" y="260" width="220" height="120" rx="28" fill="#0F1A2B" stroke="#314860" stroke-width="2"/>
    <text x="408" y="320" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">Plan + Skill</text>
    <text x="411" y="350" fill="#95AFCF" font-size="18" font-family="Arial, sans-serif">codify method</text>

    <rect x="650" y="260" width="220" height="120" rx="28" fill="#0F1A2B" stroke="#314860" stroke-width="2"/>
    <text x="703" y="320" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">Auto Dev</text>
    <text x="708" y="350" fill="#95AFCF" font-size="18" font-family="Arial, sans-serif">worktree run</text>

    <rect x="940" y="208" width="250" height="100" rx="26" fill="#101C2E" stroke="#314860" stroke-width="2"/>
    <text x="995" y="266" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">Smoke / QA</text>

    <rect x="940" y="336" width="250" height="100" rx="26" fill="#101C2E" stroke="#314860" stroke-width="2"/>
    <text x="972" y="394" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">Contracts + Lint</text>

    <rect x="1260" y="260" width="220" height="120" rx="28" fill="#0F1A2B" stroke="#314860" stroke-width="2"/>
    <text x="1330" y="320" fill="#F4F7FB" font-size="28" font-family="Arial, sans-serif" font-weight="700">PR Gate</text>
    <text x="1318" y="350" fill="#95AFCF" font-size="18" font-family="Arial, sans-serif">human merge</text>
  </g>

  <path d="M290 320 H360" stroke="url(#pipelineAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M580 320 H650" stroke="url(#pipelineAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M870 320 H940" stroke="url(#pipelineAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1190 320 H1260" stroke="url(#pipelineAccent)" stroke-width="10" stroke-linecap="round"/>

  <path d="M1065 308 V336" stroke="#8FE0D1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1065" cy="322" r="14" fill="#F6B36A"/>

  <g filter="url(#pipelineShadow)">
    <rect x="210" y="530" width="1180" height="200" rx="34" fill="#0E1727" stroke="#243A52" stroke-width="2"/>
    <text x="260" y="590" fill="#F4F7FB" font-size="32" font-family="Arial, sans-serif" font-weight="700">What the pipeline enforces</text>

    <rect x="260" y="626" width="210" height="56" rx="18" fill="#13243A"/>
    <rect x="495" y="626" width="240" height="56" rx="18" fill="#13243A"/>
    <rect x="760" y="626" width="195" height="56" rx="18" fill="#13243A"/>
    <rect x="980" y="626" width="170" height="56" rx="18" fill="#13243A"/>
    <rect x="1175" y="626" width="170" height="56" rx="18" fill="#13243A"/>

    <text x="302" y="662" fill="#DDE8F7" font-size="22" font-family="Arial, sans-serif">Shared context</text>
    <text x="543" y="662" fill="#DDE8F7" font-size="22" font-family="Arial, sans-serif">Repeatable validation</text>
    <text x="803" y="662" fill="#DDE8F7" font-size="22" font-family="Arial, sans-serif">Fast feedback</text>
    <text x="1024" y="662" fill="#DDE8F7" font-size="22" font-family="Arial, sans-serif">Safe rollout</text>
    <text x="1218" y="662" fill="#DDE8F7" font-size="22" font-family="Arial, sans-serif">Audit trail</text>
  </g>
</svg>
