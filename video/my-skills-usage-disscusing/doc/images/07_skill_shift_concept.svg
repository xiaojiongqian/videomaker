    <rect x="1220" y="350" width="200" height="150" rx="26" fill="#111E31" stroke="#33506F"/>
    <text x="1268" y="404" fill="#F4F7FB" font-size="26" font-family="Arial, sans-serif" font-weight="700">Scripts</text>
    <text x="1268" y="440" fill="#93AECE" font-size="18" font-family="Arial, sans-serif">deterministic</text>

    <rect x="990" y="534" width="200" height="150" rx="26" fill="#111E31" stroke="#33506F"/>
    <text x="1021" y="588" fill="#F4F7FB" font-size="26" font-family="Arial, sans-serif" font-weight="700">References</text>
    <text x="1038" y="624" fill="#93AECE" font-size="18" font-family="Arial, sans-serif">domain memory</text>

    <rect x="1220" y="534" width="200" height="150" rx="26" fill="#111E31" stroke="#33506F"/>
    <text x="1272" y="588" fill="#F4F7FB" font-size="26" font-family="Arial, sans-serif" font-weight="700">Assets</text>
    <text x="1265" y="624" fill="#93AECE" font-size="18" font-family="Arial, sans-serif">templates</text>

    <path d="M1090 500 V534" stroke="#8FE0D1" stroke-width="8" stroke-linecap="round"/>
    <path d="M1320 500 V534" stroke="#8FE0D1" stroke-width="8" stroke-linecap="round"/>
    <path d="M1190 425 H1220" stroke="#6DB8FF" stroke-width="8" stroke-linecap="round"/>
