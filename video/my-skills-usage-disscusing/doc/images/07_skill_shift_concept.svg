<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="1420" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.52" stop-color="#101A2C"/>
      <stop offset="1" stop-color="#1A2334"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="220" x2="1280" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6DB8FF"/>
      <stop offset="1" stop-color="#8FE0D1"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6B36A"/>
      <stop offset="1" stop-color="#F0894F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02060D" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="240" cy="140" r="180" fill="#6DB8FF" fill-opacity="0.12"/>
  <circle cx="1300" cy="780" r="220" fill="#8FE0D1" fill-opacity="0.08"/>

  <text x="120" y="120" fill="#F4F7FB" font-size="54" font-family="Arial, sans-serif" font-weight="700">From Heavy Context to Modular Skills</text>
  <text x="120" y="170" fill="#9EB8D8" font-size="24" font-family="Arial, sans-serif">A lighter operating model for agent workflows</text>

  <g filter="url(#shadow)">
