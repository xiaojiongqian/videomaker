    <text x="150" y="292" fill="#F4F7FB" font-size="34" font-family="Arial, sans-serif" font-weight="700">Context-heavy tooling</text>
    <text x="150" y="330" fill="#8DA8C8" font-size="22" font-family="Arial, sans-serif">Big prompts, tangled dependencies, repeated setup</text>

    <rect x="150" y="382" width="250" height="90" rx="24" fill="#152237" stroke="#324766"/>
    <rect x="192" y="408" width="132" height="12" rx="6" fill="#6DB8FF" fill-opacity="0.72"/>
    <rect x="192" y="432" width="170" height="10" rx="5" fill="#5E708B"/>

    <rect x="240" y="500" width="250" height="90" rx="24" fill="#152237" stroke="#324766"/>
    <rect x="282" y="526" width="142" height="12" rx="6" fill="#6DB8FF" fill-opacity="0.6"/>
    <rect x="282" y="550" width="158" height="10" rx="5" fill="#5E708B"/>

    <rect x="160" y="616" width="250" height="90" rx="24" fill="#152237" stroke="#324766"/>
    <rect x="202" y="642" width="152" height="12" rx="6" fill="#6DB8FF" fill-opacity="0.5"/>
    <rect x="202" y="666" width="172" height="10" rx="5" fill="#5E708B"/>

    <path d="M410 428 C520 438 505 520 430 548" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
    <path d="M330 660 C460 662 536 530 415 458" stroke="url(#warm)" stroke-opacity="0.44" stroke-width="8" stroke-linecap="round"/>
    <circle cx="540" cy="642" r="22" fill="url(#warm)" fill-opacity="0.9"/>
    <circle cx="505" cy="522" r="14" fill="#6DB8FF" fill-opacity="0.85"/>
  </g>

  <g>
    <path d="M670 485 C770 430 830 425 930 450" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 18" opacity="0.85"/>
    <circle cx="798" cy="454" r="46" fill="#0E1829" stroke="#6DB8FF" stroke-width="3"/>
    <path d="M780 454 L796 470 L818 438" stroke="#8FE0D1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="754" y="532" fill="#9EB8D8" font-size="20" font-family="Arial, sans-serif">refine</text>
  </g>

