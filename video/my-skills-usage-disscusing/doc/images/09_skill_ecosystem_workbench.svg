  <path d="M490 502 H540" stroke="url(#workbenchAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M960 380 H1010" stroke="url(#workbenchAccent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M960 640 H1010" stroke="url(#workbenchAccent)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="515" cy="502" r="18" fill="#F6B36A"/>
  <circle cx="985" cy="380" r="18" fill="#8FE0D1"/>
  <circle cx="985" cy="640" r="18" fill="#6DB8FF"/>
